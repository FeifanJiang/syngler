# CELL on youtube — config schema consumed by baselines/cell/run.py.
# Defaults mirror the rebuttal-era CELL invocation.
dataset: youtube
rank: null          # auto: 16 (n<=1500), 24 (<=2500), 32 (>2500)
steps: 400
lr: 0.1
weight_decay: 1.0e-7
device: auto        # auto | cpu | cuda | cuda:0
num_samples: 200
callback_every: 20
edge_overlap_limit: 0.95
